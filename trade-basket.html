<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trade Request Basket — Arcane Archive</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/group.css"></head>
<body><nav class="site-nav" id="basket-nav"><a class="brand" href="index.html">Arcane Archive</a><div class="nav-links"><a href="all-collections.html">All Collections</a><a href="pack-pullers.html">Pack Pullers</a><a class="active" href="trade-basket.html">Trade Basket</a></div></nav>
<main class="browser-shell trade-sheet"><header class="page-hero"><p class="eyebrow">ASK THE OWNER</p><h1>Cards I’m Interested In</h1><p>This is a request list, not a binding offer. Confirm availability and condition with each owner.</p><p id="generated-date"></p></header>
<section class="basket-actions"><button id="copy-text" type="button">Copy plain text</button><button id="copy-markdown" type="button">Copy Markdown</button><button id="download-json" type="button">Download JSON</button><button id="download-csv" type="button">Download CSV</button><button id="print" type="button">Print / Save PDF</button><button id="screenshot" type="button">Prepare Screenshot</button></section>
<p id="requester-name" hidden></p><div id="basket-feedback" class="collection-status" role="status"></div><section id="basket-content"></section>
<section class="shopping-section"><h2>Shopping List</h2><p>Cards nobody in the group owns, or additional copies you may want to buy.</p><form id="shopping-form"><input id="shopping-name" required placeholder="Card name"><input id="shopping-quantity" type="number" min="1" value="1"><input id="shopping-printing" placeholder="Preferred printing (optional)"><input id="shopping-note" placeholder="Notes (optional)"><button type="submit">Add to Shopping List</button></form><div id="shopping-content"></div></section>
<div class="screenshot-actions"><button id="exit-screenshot" type="button">Exit Screenshot Mode</button></div></main>
<script src="js/collection-core.js"></script><script src="js/trade-basket.js"></script></body></html>
