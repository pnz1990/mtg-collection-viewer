<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pack Pull Guide — Arcane Archive</title><meta name="description" content="A booster-specific Magic card and treatment reference.">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/group.css"><link rel="stylesheet" href="css/pack-pullers.css">
</head><body data-pack-page="reference">
<nav class="site-nav"><a class="brand" href="index.html">Arcane Archive</a><div class="nav-links"><a href="all-collections.html">All Collections</a><a class="active" href="pack-pullers.html">Pack Pullers</a><a href="trade-basket.html">Trade Basket</a></div></nav>
<main class="browser-shell pack-shell">
<header class="pack-guide-hero"><div><a href="pack-pullers.html" class="back-link">← All products</a><p class="eyebrow">PACK PULL GUIDE</p><h1 id="product-title">Loading product…</h1><p id="product-summary"></p></div><div class="currency-panel"><strong id="rate-summary">AUD conversion unavailable</strong><small id="rate-updated"></small><div><button id="refresh-rate" type="button">Refresh rate</button><button id="refresh-prices" type="button">Refresh prices</button></div></div></header>
<section id="special-note" class="special-note" hidden></section><div id="pack-status" class="collection-status" role="status">Loading the committed pull index…</div>
<section class="pack-toolbar" aria-label="Pack guide controls"><label class="pack-search">Search card name<input id="pack-search" type="search" autocomplete="off" placeholder="Search eligible printings"></label><label>Sort<select id="pack-sort"><option value="collector">Collector number ↑</option><option value="collector-desc">Collector number ↓</option><option value="name">Card name</option><option value="set">Set</option><option value="rarity">Rarity</option><option value="usd-desc">USD price</option><option value="aud-desc">AUD price</option><option value="treatment">Treatment</option><option value="slot">Booster slot</option></select></label><div class="view-toggle"><button id="view-list" type="button">Compact list</button><button id="view-grid" type="button">Small grid</button></div><label class="toggle"><input id="quick-mode" type="checkbox"> Quick Pack Mode</label></section>
<div class="pack-browser"><aside id="pack-filters" class="pack-filters"><h2>Filters</h2><label>Set code<select id="filter-set"><option value="">All sets</option></select></label><label>Rarity<select id="filter-rarity"><option value="">All rarities</option><option>common</option><option>uncommon</option><option>rare</option><option>mythic</option></select></label><label>Colour<select id="filter-colour"><option value="">All colours</option><option value="W">White</option><option value="U">Blue</option><option value="B">Black</option><option value="R">Red</option><option value="G">Green</option></select></label><label>Card type<select id="filter-type"><option value="">All types</option><option>Creature</option><option>Instant</option><option>Sorcery</option><option>Artifact</option><option>Enchantment</option><option>Planeswalker</option><option>Land</option></select></label><label>Treatment<select id="filter-treatment"><option value="">All treatments</option></select></label><label>Finish<select id="filter-finish"><option value="">All eligible finishes</option><option value="nonfoil">Non-foil</option><option value="foil">Traditional foil</option></select></label><label>Booster slot<select id="filter-slot"><option value="">All slots</option></select></label><label><input id="filter-exclusive" type="checkbox"> Collector Booster exclusive</label><label><input id="filter-priced" type="checkbox"> Price available</label><div class="price-range"><label>Min AUD<input id="filter-min" type="number" min="0" step="1"></label><label>Max AUD<input id="filter-max" type="number" min="0" step="1"></label></div><button id="clear-filters" type="button">Clear All</button></aside>
<section class="pack-results-panel"><div class="pack-result-head"><strong id="result-count"></strong><div id="active-filters" class="pack-chips"></div><button id="opening-toggle" type="button">View this opening (<span id="opening-count">0</span>)</button></div><div id="pack-results" class="pack-results compact-list"></div><button id="load-more" class="load-more-btn" type="button">Load more</button></section></div>
<section id="opening-panel" class="opening-panel" hidden><header><div><p class="eyebrow">THIS OPENING</p><h2>Pulled cards</h2></div><button id="close-opening" type="button">Close</button></header><div id="opening-items"></div><div class="opening-actions"><button id="copy-opening" type="button">Copy pulled cards</button><button id="export-opening" type="button">Export text</button><button id="clear-opening" type="button">Clear opening</button></div></section>
<section id="source-panel" class="source-panel"></section>
</main><script src="js/pack-puller-core.js"></script><script src="js/pack-puller.js"></script></body></html>
